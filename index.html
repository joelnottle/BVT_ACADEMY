<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BVT Academy — Prototype</title>
  <meta name="description" content="BVT Academy clickable prototype. No data is sent.">
  <link rel="icon" href="assets/img/favicon-64.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout-public.css">
  <link rel="stylesheet" href="css/layout-portal.css">
  <link rel="stylesheet" href="css/layout-sidebar.css">
  <link rel="stylesheet" href="css/pages/public.css">
  <link rel="stylesheet" href="css/pages/check.css">
  <link rel="stylesheet" href="css/pages/enrol.css">
  <link rel="stylesheet" href="css/pages/dashboard.css">
  <link rel="stylesheet" href="css/pages/academy.css">
  <link rel="stylesheet" href="css/pages/requirement.css">
  <link rel="stylesheet" href="css/pages/support.css">
  <link rel="stylesheet" href="css/pages/account.css">
  <link rel="stylesheet" href="css/pages/styleguide.css">

  <!-- Lucide icons, pinned. Deferred, so it runs before the module below. -->
  <script src="https://unpkg.com/lucide@1.61.0/dist/umd/lucide.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Shared gradient for line icons (.icon-grad). userSpaceOnUse so straight strokes still paint. -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="bvt-icon-grad" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="22" y2="22">
        <stop offset="0" class="icon-grad-a"></stop><stop offset="1" class="icon-grad-b"></stop>
      </linearGradient>
    </defs>
  </svg>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="app"></div>
  <div id="demo-root"></div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-relevant="additions"></div>
  <div id="sr-status" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript>This prototype needs JavaScript. Run it with VS Code Live Server.</noscript>
  <!-- Opened straight from Finder? ES modules don't load over file://, so explain instead of showing a blank page. -->
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML =
        '<main class="container file-notice"><h1 class="h2">Open this prototype through a local server</h1>' +
        '<p class="lead">Browsers block the prototype’s scripts when index.html is opened directly from your computer.</p>' +
        '<ol><li><strong>VS Code:</strong> right-click <code>index.html</code> → <em>Open with Live Server</em>.</li>' +
        '<li><strong>Terminal:</strong> <code>cd</code> into this folder, run <code>python3 -m http.server 5500</code>, then open <code>http://localhost:5500</code>.</li></ol></main>';
    }
  </script>
</body>
</html>
