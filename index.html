<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BVT Academy — Prototype</title>
  <meta name="description" content="BVT Academy clickable prototype. No data is sent.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout-public.css">
  <link rel="stylesheet" href="css/layout-portal.css">
  <link rel="stylesheet" href="css/layout-sidebar.css">
  <link rel="stylesheet" href="css/pages/styleguide.css">

  <!-- Lucide icons, pinned. Deferred, so it runs before the module below. -->
  <script src="https://unpkg.com/lucide@1.61.0/dist/umd/lucide.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Shared gradient for line icons (.icon-grad). userSpaceOnUse so straight strokes still paint. -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="bvt-icon-grad" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="22" y2="22">
        <stop offset="0" class="icon-grad-a"></stop><stop offset="1" class="icon-grad-b"></stop>
      </linearGradient>
    </defs>
  </svg>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="app"></div>
  <div id="demo-root"></div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-relevant="additions"></div>
  <noscript>This prototype needs JavaScript. Run it with VS Code Live Server.</noscript>
</body>
</html>
